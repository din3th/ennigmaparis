services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: server/.env
        required: false
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/ennigma
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      # Required: export JWT_SECRET (e.g. `openssl rand -hex 32`) before `docker compose up`
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    # Only reachable from this machine, not the network.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:

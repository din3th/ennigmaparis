version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/ennigma
      - FRONTEND_URL=http://localhost:5174
      - JWT_SECRET=productionsecretkeyennigmaparis2026
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:6-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
